[package]
name = "server"
version = "0.1.44"
edition = "2024"
default-run = "server"

[lints.clippy]
uninlined-format-args = "allow"

[dependencies]
web-push = { version = "0.11", default-features = false }
libc = "0.2"
server-access = { path = "../server-access" }
tower = { version = "0.5", features = ["util"] }
api-types = { path = "../api-types" }
deployment = { path = "../deployment" }
executors = { path = "../executors" }
local-deployment = { path = "../local-deployment" }
utils = { path = "../utils" }
git = { path = "../git" }
git-host = { path = "../git-host" }
db = { path = "../db" }
services = { path = "../services" }
workflow = { path = "../workflow" }
worktree-manager = { path = "../worktree-manager" }
workspace-manager = { path = "../workspace-manager" }
ws-bridge = { path = "../ws-bridge" }
preview-proxy = { path = "../preview-proxy" }
tokio = { workspace = true }
shlex = "1.3.0"
tokio-util = { version = "0.7", features = ["io"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
tower-http = { workspace = true }
schemars = { workspace = true }
sentry = { version = "0.46.2", default-features = false, features = ["anyhow", "backtrace", "panic", "debug-images", "reqwest", "rustls"] }
reqwest = { workspace = true, features = ["form"] }
rustls = { workspace = true }
aws-lc-sys = { workspace = true }
aws-lc-rs = { workspace = true }
strip-ansi-escapes = "0.2.1"
thiserror = { workspace = true }
os_info = "3.12.0"
futures-util = "0.3"
http = "1"
base64 = "0.22"
mime_guess = "2.0"
rust-embed = "8.2"
url = "2.5"
rand = { version = "0.8", features = ["std"] }
tempfile = "3"
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
# The npm release cross-compiles Linux with zig; Wayland's pkg-config probe is not cross-safe.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

rmcp = { version = "1.8.0", features = ["server", "transport-streamable-http-server"] }

[build-dependencies]
dotenv = "0.15"

[features]
developer-runtime = ["rust-embed/debug-embed", "utils/embedded-assets"]
default = []
qa-mode = ["services/qa-mode", "executors/qa-mode"]

[dev-dependencies]
server-access = { path = "../server-access", features = ["test-support"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
rsa = "0.9"
