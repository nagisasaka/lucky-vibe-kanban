[package]
name = "server-access"
version = "0.1.44"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
http = "1"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "uuid"] }
openidconnect = { version = "4.0.1", default-features = false }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
subtle = "2.6"
futures-util = "0.3"
cookie = "0.18"
tracing = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
rsa = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

[features]
# Explicit fixture construction for downstream integration tests, never enabled by server builds.
test-support = []
