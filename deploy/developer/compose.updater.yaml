# Optional: copy into the host deployment directory after install.py.
# Only requests are writable by agents; no Docker socket or host shell access.
services:
  lvk:
    volumes:
      - type: bind
        source: ${LVK_UPDATER_STATE:-/var/lib/lvk-updater}/requests
        target: /run/lvk-update/requests
        bind: { create_host_path: false }
      - type: bind
        source: ${LVK_UPDATER_STATE:-/var/lib/lvk-updater}/status
        target: /run/lvk-update/status
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${LVK_UPDATER_STATE:-/var/lib/lvk-updater}/maintenance
        target: /run/lvk-maintenance
        read_only: true
        bind: { create_host_path: false }
