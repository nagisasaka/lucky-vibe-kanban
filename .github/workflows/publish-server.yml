name: Build and publish LVK server image

on:
  push:
    tags: ["v*"]
  # Build a branch's image and refresh the build cache, without publishing an
  # application image. No GitHub Release is required.
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.1"
  PNPM_VERSION: "10.13.1"

concurrency:
  # All releases share one registry cache; serialize writers across tags.
  group: lvk-server-image
  cancel-in-progress: false

jobs:
  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - name: Check owned UI translations (EN and JA)
        run: |
          pnpm run i18n:test
          pnpm run i18n:check
          node scripts/check-unused-i18n-keys.mjs
      - name: Validate server configuration
        run: |
          pnpm run server:check
          pnpm run developer:check
          docker compose -f deploy/server/compose.yaml -f deploy/developer/compose.staging.yaml -f deploy/developer/compose.updater.yaml config --quiet
          docker compose -f deploy/server/compose.yaml -f deploy/server/compose.acme.yaml config --quiet
          docker compose -f deploy/server/compose.yaml -f deploy/server/compose.acme.yaml -f deploy/server/compose.development.yaml --profile development config --quiet
        env:
          LVK_IMAGE: ghcr.io/example/lvk:test
          LVK_HOST: 192.0.2.1
          LVK_ACME_AGREE_TOS: "yes"
      - name: Choose image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || {
              echo 'Expected v1.2.3 or v1.2.3-rc.1'; exit 1;
            }
          else
            version="test-${GITHUB_SHA:0:12}"
          fi
          echo "reference=$repository:$version" >> "$GITHUB_OUTPUT"
          echo "cache=$repository:buildcache" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for the shared build cache
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the binary source matches the public source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
      - name: Build (not yet published)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.reference }}
          build-args: |
            LVK_BUILD_REVISION=${{ github.sha }}
            LVK_BUILD_KIND=${{ github.ref_type == 'tag' && 'release' || 'development' }}
            LVK_BUILD_RELEASE_TAG=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            LVK_BUILD_DIRTY=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            io.lvk.actions-run-id=${{ github.run_id }}
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }},mode=max
      - name: Publish the built image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          LVK_PUBLISH_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          docker push "$LVK_PUBLISH_IMAGE"
          echo "Published: $LVK_PUBLISH_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the digest printed by docker push for immutable deployment pinning.' >> "$GITHUB_STEP_SUMMARY"
